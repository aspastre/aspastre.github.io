<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adriano Pastre | Design de Interiores & Modelagem 3D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #1e1e1e;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #3498db;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
            color: #ffffff;
        }
        h2 {
            margin: 10px 0 20px;
            font-size: 1.2em;
            color: #3498db;
            font-weight: 400;
        }
        .contact-info {
            font-size: 0.9em;
            color: #aaaaaa;
        }
        .contact-info a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .summary {
            text-align: center;
            margin-bottom: 50px;
            font-size: 1.1em;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        /* ESTILOS DO CARD EM DESTAQUE */
        .card.featured {
            grid-column: 1 / -1;
        }
        .featured-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2px;
            background-color: #333;
        }
        .featured-gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 1px solid #333;
            transition: opacity 0.3s ease;
            cursor: zoom-in;
        }
        .featured-gallery img:hover {
            opacity: 0.8;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }

            height: 200px;
